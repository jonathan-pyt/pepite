name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Lancement manuel : vérifie les identifiants des stores sans rien soumettre.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter "@pepite/core" test
      # Tests unitaires extension (vitest + fakeBrowser, sans navigateur).
      # Les E2E Playwright (pnpm e2e) restent locaux : navigateur headed requis.
      - run: pnpm --filter "@pepite/extension" test
      - run: pnpm --filter "@pepite/extension" build
      - run: pnpm --filter "@pepite/extension" build:firefox

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Le tag doit correspondre à la version du package
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/extension/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG ≠ version $VERSION dans packages/extension/package.json — bump la version avant de taguer."
            exit 1
          fi
      - run: pnpm --filter "@pepite/extension" zip
      - run: pnpm --filter "@pepite/extension" zip:firefox
      # Partagés avec le job submit : on soumet aux stores exactement les
      # archives publiées ici, pas une reconstruction.
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: packages/extension/.output/*.zip
          retention-days: 7
      - uses: softprops/action-gh-release@v3
        with:
          # *-firefox.zip exclut volontairement le *-sources.zip généré par wxt zip -b firefox
          files: |
            packages/extension/.output/*-chrome.zip
            packages/extension/.output/*-firefox.zip
          generate_release_notes: true

  # Vérification à blanc des identifiants de store, sur lancement manuel
  # (Actions → CI → Run workflow). S'authentifie auprès des deux stores et
  # s'arrête là : aucune archive n'est envoyée, aucune revue déclenchée.
  # C'est le seul moyen de valider les secrets réellement utilisés en release
  # — une copie locale dans .env.submit ne prouverait rien sur ceux du dépôt.
  submit-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Les archives doivent exister : l'outil vérifie les chemins avant d'authentifier.
      - run: pnpm --filter "@pepite/extension" zip
      - run: pnpm --filter "@pepite/extension" zip:firefox
      - name: Vérifier les identifiants (sans soumettre)
        working-directory: packages/extension
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: pnpm run submit:dry

  # Soumission au Chrome Web Store et à Firefox AMO, automatique sur tag.
  # Les deux stores passent ensuite par leur propre revue avant publication.
  submit:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: packages/extension/.output

      # Secrets absents partout = stores pas encore configurés : on n'échoue
      # pas la release pour autant. Secrets partiels = vraie erreur de config,
      # qu'il vaut mieux voir tout de suite qu'après un tag raté.
      - name: Vérifier les secrets des stores
        id: creds
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          required="CHROME_EXTENSION_ID CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN \
                    FIREFOX_EXTENSION_ID FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET"
          missing=""; present=""
          for name in $required; do
            if [ -z "$(eval echo \"\$$name\")" ]; then missing="$missing $name"; else present="$present $name"; fi
          done
          if [ -z "$present" ]; then
            echo "::notice::Aucun secret de store configuré — soumission ignorée. Renseigne les secrets du dépôt pour l'activer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::Secrets de store incomplets, il manque :$missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Soumettre aux stores
        if: steps.creds.outputs.ready == 'true'
        working-directory: packages/extension
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        # AMO exige les sources pour toute extension construite : wxt zip -b
        # firefox produit le *-sources.zip, joint automatiquement par le script.
        run: pnpm run submit
